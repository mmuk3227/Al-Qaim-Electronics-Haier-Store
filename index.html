<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Qaim Electronics | Authorized Haier Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="nav-container">
            <div class="logo">
                ⚡ Al Qaim <span>Electronics</span> <small class="brand-tag">Haier Store</small>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search model, series, or category...">
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button id="theme-toggle" class="theme-btn">🌙 Dark</button>
                <button class="cart-btn" id="openCartBtn">
                    🛒 Cart (<span id="cartCount">0</span>)
                </button>
            </div>
        </div>
        
        <!-- Category Filter Navigation Bar -->
        <div class="category-nav" id="categoryNav">
            <button class="cat-chip active" data-category="all">🔥 All Products</button>
            <button class="cat-chip" data-category="ac">❄️ ACs</button>
            <button class="cat-chip" data-category="fridge">🧊 Refrigerators</button>
            <button class="cat-chip" data-category="freezer">🌀 Deep Freezers</button>
            <button class="cat-chip" data-category="washing">🧺 Washing Machines</button>
            <button class="cat-chip" data-category="led">📺 Smart LEDs</button>
            <button class="cat-chip" data-category="oven">🍿 Ovens & Fryers</button>
        </div>
    </header>

    <!-- Hero Banner -->
<section class="hero">
    <h1><span class="side-text">Official</span> <span>Haier Appliances</span> <span class="side-text">Store</span></h1>
    <p>Explore original Haier Inverter ACs, Refrigerators, Freezers & Home Appliances</p>
</section>

    <!-- Main Dynamic Catalog Container -->
    <main class="main-container">
        <div id="catalogContainer">
            <!-- Dynamic Categories & Products -->
        </div>
    </main>

    <!-- Cart Sidebar -->
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Your Selected Items</h3>
            <button id="closeCartBtn">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="empty-msg">Your cart is empty.</p>
        </div>
        <div class="cart-footer">
            <div class="total-price">
                Total: PKR <span id="cartTotal">0</span>
            </div>
            <button class="whatsapp-btn" id="whatsappOrderBtn">💬 Order via WhatsApp</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Al Qaim Electronics - Authorized Haier Dealer. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
